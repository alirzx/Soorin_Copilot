name: soorin-copilot

x-app-image: &app-image soorin-copilot:${SOORIN_IMAGE_TAG:-rag-local}

services:
  api:
    image: *app-image
    pull_policy: never

    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12"
        APP_UID: "${APP_UID:-10001}"
        APP_GID: "${APP_GID:-10001}"

    container_name: soorin-copilot-api

    command:
      - python
      - app/run.py
      - --api

    env_file:
      - ./app/.env

    environment:
      PYTHONPATH: /workspace/app

      API_HOST: 0.0.0.0
      API_PORT: "6998"
      API_RELOAD: "false"
      LOG_LEVEL: "${SOORIN_LOG_LEVEL:-INFO}"

      SOORIN_HOST: 0.0.0.0
      SOORIN_PORT: "6998"

    ports:
      - "${SOORIN_API_BIND_IP:-127.0.0.1}:${SOORIN_API_PORT:-6998}:6998"

    volumes:
      # Graph, topology and other shared runtime data.
      - copilot-data:/workspace/data

      # Embedded Qdrant storage. API is the only owner.
      - copilot-qdrant:/workspace/data/qdrant-local

      # Hugging Face model cache.
      - copilot-cache:/home/soorin/.cache

    restart: unless-stopped
    init: true
    stop_grace_period: 60s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:6998/health",
          timeout=5
          ).read();
          urllib.request.urlopen(
          "http://127.0.0.1:6998/openapi.json",
          timeout=10
          ).read()
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 6

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    networks:
      - copilot-network

  ui:
    image: *app-image
    pull_policy: never

    container_name: soorin-copilot-ui

    command:
      - python
      - -m
      - streamlit
      - run
      - app/app_st.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false

    env_file:
      - ./app/.env

    environment:
      PYTHONPATH: /workspace/app

      SOORIN_API_BASE_URL: http://api:6998
      SOORIN_COPILOT_API_URL: http://api:6998

      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    ports:
      # Host port remains 8503; container port remains 8501.
      - "${SOORIN_UI_BIND_IP:-127.0.0.1}:${SOORIN_UI_PORT:-8503}:8501"

    volumes:
      # UI can read topology data but cannot modify it.
      - copilot-data:/workspace/data:ro

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped
    init: true
    stop_grace_period: 20s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from pathlib import Path;
          import urllib.request;
          Path(
          "/workspace/app/app_st.py"
          ).open("rb").read(1);
          urllib.request.urlopen(
          "http://127.0.0.1:8501/_stcore/health",
          timeout=5
          ).read()
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    networks:
      - copilot-network

networks:
  copilot-network:
    driver: bridge

volumes:
  copilot-data:
  copilot-cache:
  copilot-qdrant: