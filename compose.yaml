name: soorin-copilot

x-app-image: &app-image soorin-copilot:${SOORIN_IMAGE_TAG:-rag-local}
x-app-env: &app-env
  - ${SOORIN_APP_ENV_FILE:-./app/.env}

services:
  api:
    image: *app-image
    pull_policy: never

    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12"
        APP_UID: "${APP_UID:-10001}"
        APP_GID: "${APP_GID:-10001}"

    container_name: soorin-copilot-api

    command:
      - python
      - app/run.py
      - --api

    env_file: *app-env

    environment:
      PYTHONPATH: /workspace/app

      API_HOST: 0.0.0.0
      API_PORT: "6998"
      API_RELOAD: "false"
      LOG_LEVEL: "${SOORIN_LOG_LEVEL:-INFO}"

      SOORIN_HOST: 0.0.0.0
      SOORIN_PORT: "6998"

      SOORIN_RAG_SOURCE_ROOT: ""
      SOORIN_RAG_QDRANT_MODE: local
      SOORIN_RAG_QDRANT_PATH: /workspace/data/qdrant-local
      SOORIN_RAG_EMBEDDING_LOCAL_FILES_ONLY: "true"
      SOORIN_RAG_EMBEDDING_CACHE_DIR: /home/soorin/.cache/huggingface/hub

      SOORIN_LOG_FILE_PATH: /workspace/data/runtime/logs/soorin-copilot.log
      SOORIN_EVIDENCE_SNAPSHOT_ROOT: /workspace/data/runtime/evidence

      SOORIN_LOCAL_PRODUCT_SIMULATION_ENABLED: "${SOORIN_LOCAL_PRODUCT_SIMULATION_ENABLED:-false}"
      SOORIN_THREAD_STATE_BACKEND: "${SOORIN_THREAD_STATE_BACKEND:-memory}"
      SOORIN_LOCAL_SQLITE_PATH: "${SOORIN_LOCAL_SQLITE_PATH:-/workspace/data/runtime/copilot-local.sqlite3}"
      SOORIN_LANGGRAPH_CHECKPOINT_BACKEND: "${SOORIN_LANGGRAPH_CHECKPOINT_BACKEND:-none}"

      HF_HOME: /home/soorin/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"

    ports:
      - "${SOORIN_API_BIND_IP:-127.0.0.1}:${SOORIN_API_PORT:-6998}:6998"

    volumes:
      - type: bind
        source: ${SOORIN_DATA_HOST_PATH:?SOORIN_DATA_HOST_PATH is required}
        target: /workspace/data
        read_only: false
        bind:
          create_host_path: false

      - type: bind
        source: ${SOORIN_HF_CACHE_HOST_PATH:?SOORIN_HF_CACHE_HOST_PATH is required}
        target: /home/soorin/.cache/huggingface
        read_only: true
        bind:
          create_host_path: false

    restart: "${SOORIN_RESTART_POLICY:-unless-stopped}"
    init: true
    stop_grace_period: 60s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:6998/health",
          timeout=5
          ).read();
          urllib.request.urlopen(
          "http://127.0.0.1:6998/openapi.json",
          timeout=10
          ).read()
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 6

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    networks:
      - copilot-network

  ui:
    image: *app-image
    pull_policy: never

    container_name: soorin-copilot-ui

    command:
      - python
      - -m
      - streamlit
      - run
      - app/app_st.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false

    env_file: *app-env

    environment:
      PYTHONPATH: /workspace/app

      SOORIN_API_BASE_URL: http://api:6998
      SOORIN_COPILOT_API_URL: http://api:6998
      SOORIN_API_TIMEOUT_SECONDS: "${SOORIN_API_TIMEOUT_SECONDS:-600}"

      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    ports:
      - "${SOORIN_UI_BIND_IP:-127.0.0.1}:${SOORIN_UI_PORT:-8503}:8501"

    volumes:
      - type: bind
        source: ${SOORIN_DATA_HOST_PATH:?SOORIN_DATA_HOST_PATH is required}
        target: /workspace/data
        read_only: true
        bind:
          create_host_path: false

    depends_on:
      api:
        condition: service_healthy

    restart: "${SOORIN_RESTART_POLICY:-unless-stopped}"
    init: true
    stop_grace_period: 20s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from pathlib import Path;
          import urllib.request;
          Path("/workspace/app/app_st.py").open("rb").read(1);
          urllib.request.urlopen(
          "http://127.0.0.1:8501/_stcore/health",
          timeout=5
          ).read()
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    networks:
      - copilot-network

networks:
  copilot-network:
    driver: bridge
