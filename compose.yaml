name: soorin-copilot

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12"
        APP_UID: "${APP_UID:-10001}"
        APP_GID: "${APP_GID:-10001}"

    image: soorin-copilot:${SOORIN_IMAGE_TAG:-local}
    container_name: soorin-copilot-api

    # Use the project launcher so configure_logging() runs before Uvicorn.
    command:
      - python
      - app/run.py
      - --api

    env_file:
      - ./app/.env

    environment:
      PYTHONPATH: /workspace/app

      # Settings consumed by app/run.py.
      API_HOST: 0.0.0.0
      API_PORT: "6998"
      API_RELOAD: "false"
      LOG_LEVEL: "${SOORIN_LOG_LEVEL:-INFO}"

      # Retained for components that use the SOORIN-prefixed settings.
      SOORIN_HOST: 0.0.0.0
      SOORIN_PORT: "6998"

    ports:
      - "${SOORIN_API_BIND_IP:-127.0.0.1}:${SOORIN_API_PORT:-6998}:6998"

    volumes:
      - copilot-data:/workspace/data
      - copilot-cache:/home/soorin/.cache

    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:6998/health",
          timeout=3
          )
      interval: 20s
      timeout: 5s
      start_period: 40s
      retries: 8

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    networks:
      - copilot-network

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12"
        APP_UID: "${APP_UID:-10001}"
        APP_GID: "${APP_GID:-10001}"

    image: soorin-copilot:${SOORIN_IMAGE_TAG:-local}
    container_name: soorin-copilot-ui

    # Keep explicit Streamlit startup so it binds correctly inside Docker.
    command:
      - python
      - -m
      - streamlit
      - run
      - app/app_st.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false

    env_file:
      - ./app/.env

    environment:
      PYTHONPATH: /workspace/app

      # The UI must call the API by its Docker service name.
      SOORIN_API_BASE_URL: http://api:6998
      SOORIN_COPILOT_API_URL: http://api:6998

      # Keep internal Streamlit configuration consistent with the command.
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    ports:
      - "${SOORIN_UI_BIND_IP:-127.0.0.1}:${SOORIN_UI_PORT:-8501}:8501"

    volumes:
      # Shared because the current topology UI may directly read graph artifacts.
      - copilot-data:/workspace/data
      - copilot-cache:/home/soorin/.cache

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped
    init: true
    stop_grace_period: 20s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:8501/_stcore/health",
          timeout=3
          )
      interval: 20s
      timeout: 5s
      start_period: 40s
      retries: 8

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    networks:
      - copilot-network

networks:
  copilot-network:
    driver: bridge

volumes:
  copilot-data:
  copilot-cache: