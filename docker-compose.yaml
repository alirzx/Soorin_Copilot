name: soorin-copilot

x-app-image: &app-image soorin-copilot:${SOORIN_IMAGE_TAG:-copilot_release_3.5.1}

x-common-service: &common-service
  image: *app-image
  build:
    context: .
    dockerfile: Dockerfile
  pull_policy: never
  restart: "${SOORIN_RESTART_POLICY:-unless-stopped}"
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"
  networks:
    - copilot-network

services:
  neo4j:
    image: neo4j:2026.07.1
    container_name: soorin-copilot-neo4j
    restart: "${SOORIN_RESTART_POLICY:-unless-stopped}"
    environment:
      NEO4J_AUTH: "${SOORIN_NEO4J_USER:-neo4j}/${SOORIN_NEO4J_PASSWORD:?SOORIN_NEO4J_PASSWORD is required}"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    ports:
      - "${SOORIN_NEO4J_BOLT_BIND_IP:-127.0.0.1}:${SOORIN_NEO4J_BOLT_HOST_PORT:-7687}:7687"
    networks:
      - copilot-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 6

  api:
    <<: *common-service
    container_name: soorin-copilot-api

    command:
      - python
      - app/run.py
      - --api

    env_file:
      - ./.env

    depends_on:
      neo4j:
        condition: service_healthy

    environment:
      PYTHONPATH: /workspace/app

      API_HOST: 0.0.0.0
      API_PORT: "6998"
      API_RELOAD: "false"

      SOORIN_HOST: 0.0.0.0
      SOORIN_PORT: "6998"
      # Containers must use the same Community service rather than a host-local URI.
      SOORIN_NEO4J_URI: bolt://neo4j:7687

      SOORIN_RAG_SOURCE_ROOT: ""
      SOORIN_RAG_QDRANT_MODE: local
      SOORIN_RAG_QDRANT_PATH: /workspace/data/qdrant-local
      SOORIN_RAG_EMBEDDING_LOCAL_FILES_ONLY: "true"
      SOORIN_RAG_EMBEDDING_CACHE_DIR: /home/soorin/.cache/huggingface/hub

      SOORIN_LOG_FILE_PATH: /workspace/data/runtime/logs/soorin-copilot.log
      SOORIN_EVIDENCE_SNAPSHOT_ROOT: /workspace/data/runtime/evidence

      SOORIN_LOCAL_PRODUCT_SIMULATION_ENABLED: "${SOORIN_LOCAL_PRODUCT_SIMULATION_ENABLED:-false}"
      SOORIN_STREAMLIT_AUTH_BACKEND: "${SOORIN_STREAMLIT_AUTH_BACKEND:-none}"
      SOORIN_LOCAL_TEST_USER_CREATION_ENABLED: "${SOORIN_LOCAL_TEST_USER_CREATION_ENABLED:-false}"
      SOORIN_THREAD_STATE_BACKEND: "${SOORIN_THREAD_STATE_BACKEND:-memory}"
      SOORIN_LOCAL_SQLITE_PATH: "${SOORIN_LOCAL_SQLITE_PATH:-/workspace/data/runtime/copilot-local.sqlite3}"
      SOORIN_LANGGRAPH_CHECKPOINT_BACKEND: "${SOORIN_LANGGRAPH_CHECKPOINT_BACKEND:-none}"

      HF_HOME: /home/soorin/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"

    ports:
      - "${SOORIN_API_BIND_IP:-0.0.0.0}:${SOORIN_API_HOST_PORT:-6998}:6998"

    volumes:
      # Runtime source is bind-mounted so host/server code fixes are visible
      # immediately without rebuilding the image. Restart/recreate the service
      # when API_RELOAD is disabled.
      - type: bind
        source: ./app
        target: /workspace/app
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./lib
        target: /workspace/lib
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./data
        target: /workspace/data
        read_only: false
        bind:
          create_host_path: false

      - type: bind
        source: ${SOORIN_HF_CACHE_HOST_PATH:-./huggingface}
        target: /home/soorin/.cache/huggingface
        read_only: true
        bind:
          create_host_path: false

    stop_grace_period: 60s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:6998/health",
          timeout=5
          ).read();
          urllib.request.urlopen(
          "http://127.0.0.1:6998/openapi.json",
          timeout=10
          ).read()
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 6

  ui:
    <<: *common-service
    container_name: soorin-copilot-ui

    command:
      - python
      - -m
      - streamlit
      - run
      - app/app_st.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false

    env_file:
      - ./.env

    environment:
      PYTHONPATH: /workspace/app

      # UI talks to the Copilot API through Docker service DNS.
      # These intentionally override any host/local values from .env.
      SOORIN_API_BASE_URL: http://api:6998
      SOORIN_COPILOT_API_URL: http://api:6998
      # The UI has no direct graph-store client; it only calls the authenticated API.
      SOORIN_NEO4J_URI: ""
      SOORIN_NEO4J_USER: ""
      SOORIN_NEO4J_PASSWORD: ""
      SOORIN_NEO4J_DATABASE: ""

      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    ports:
      - "${SOORIN_UI_BIND_IP:-0.0.0.0}:${SOORIN_UI_HOST_PORT:-8503}:8501"

    volumes:
      - type: bind
        source: ./app
        target: /workspace/app
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./lib
        target: /workspace/lib
        read_only: true
        bind:
          create_host_path: false

    depends_on:
      api:
        condition: service_healthy

    stop_grace_period: 20s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from pathlib import Path;
          import urllib.request;
          Path("/workspace/app/app_st.py").open("rb").read(1);
          urllib.request.urlopen(
          "http://127.0.0.1:8501/_stcore/health",
          timeout=5
          ).read()
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: soorin-copilot-prometheus
    profiles: ["observability"]
    restart: "${SOORIN_RESTART_POLICY:-unless-stopped}"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        case "$$SOORIN_OBSERVABILITY_ENVIRONMENT" in
          ""|*[!A-Za-z0-9_.-]*)
            echo "invalid SOORIN_OBSERVABILITY_ENVIRONMENT" >&2
            exit 1
            ;;
        esac
        sed "s/__SOORIN_OBSERVABILITY_ENVIRONMENT__/$$SOORIN_OBSERVABILITY_ENVIRONMENT/g" \
          /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=${SOORIN_OBSERVABILITY_RETENTION:-168h} \
          --web.enable-lifecycle
    environment:
      SOORIN_OBSERVABILITY_ENVIRONMENT: "${SOORIN_OBSERVABILITY_ENVIRONMENT:-development}"
    ports:
      - "${SOORIN_OBSERVABILITY_PROMETHEUS_BIND_IP:-127.0.0.1}:${SOORIN_OBSERVABILITY_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - copilot_metrics_api_key
    networks:
      - copilot-network
    depends_on:
      api:
        condition: service_healthy

  loki:
    image: grafana/loki:3.5.3
    container_name: soorin-copilot-loki
    profiles: ["observability"]
    restart: "${SOORIN_RESTART_POLICY:-unless-stopped}"
    command:
      - -config.file=/etc/loki/loki-config.yml
      - -config.expand-env=true
    environment:
      SOORIN_OBSERVABILITY_RETENTION: "${SOORIN_OBSERVABILITY_RETENTION:-168h}"
    ports:
      - "${SOORIN_OBSERVABILITY_LOKI_BIND_IP:-127.0.0.1}:${SOORIN_OBSERVABILITY_LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - copilot-network

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: soorin-copilot-alloy
    profiles: ["observability"]
    restart: "${SOORIN_RESTART_POLICY:-unless-stopped}"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
    environment:
      SOORIN_OBSERVABILITY_ENVIRONMENT: "${SOORIN_OBSERVABILITY_ENVIRONMENT:-development}"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    networks:
      - copilot-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.1
    container_name: soorin-copilot-grafana
    profiles: ["observability"]
    restart: "${SOORIN_RESTART_POLICY:-unless-stopped}"
    environment:
      GF_SECURITY_ADMIN_USER: "${SOORIN_GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${SOORIN_GRAFANA_ADMIN_PASSWORD:?SOORIN_GRAFANA_ADMIN_PASSWORD is required}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${SOORIN_OBSERVABILITY_GRAFANA_BIND_IP:-127.0.0.1}:${SOORIN_OBSERVABILITY_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - copilot-network
    depends_on:
      - prometheus
      - loki

networks:
  copilot-network:
    driver: bridge

volumes:
  neo4j-data:
  neo4j-logs:
  prometheus-data:
  loki-data:
  grafana-data:
  alloy-data:

secrets:
  copilot_metrics_api_key:
    environment: SOORIN_COPILOT_API_KEY
