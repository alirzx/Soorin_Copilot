name: soorin-copilot

x-app-image: &app-image soorin-copilot:${SOORIN_IMAGE_TAG:-copilot_release_3.1}

x-common-service: &common-service
  image: *app-image
  pull_policy: never
  restart: "${SOORIN_RESTART_POLICY:-unless-stopped}"
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"
  networks:
    - copilot-network

services:
  api:
    <<: *common-service
    container_name: soorin-copilot-api

    command:
      - python
      - app/run.py
      - --api

    env_file:
      - ./.env

    environment:
      PYTHONPATH: /workspace/app

      API_HOST: 0.0.0.0
      API_PORT: "6998"
      API_RELOAD: "false"

      SOORIN_HOST: 0.0.0.0
      SOORIN_PORT: "6998"

      SOORIN_RAG_SOURCE_ROOT: ""
      SOORIN_RAG_QDRANT_MODE: local
      SOORIN_RAG_QDRANT_PATH: /workspace/data/qdrant-local
      SOORIN_RAG_EMBEDDING_LOCAL_FILES_ONLY: "true"
      SOORIN_RAG_EMBEDDING_CACHE_DIR: /home/soorin/.cache/huggingface/hub

      SOORIN_LOG_FILE_PATH: /workspace/data/runtime/logs/soorin-copilot.log
      SOORIN_EVIDENCE_SNAPSHOT_ROOT: /workspace/data/runtime/evidence

      HF_HOME: /home/soorin/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"

    ports:
      - "${SOORIN_API_BIND_IP:-0.0.0.0}:${SOORIN_API_HOST_PORT:-6998}:6998"

    volumes:
      - type: bind
        source: ./data
        target: /workspace/data
        read_only: false
        bind:
          create_host_path: false

      - type: bind
        source: ./huggingface
        target: /home/soorin/.cache/huggingface
        read_only: true
        bind:
          create_host_path: false

    stop_grace_period: 60s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:6998/health",
          timeout=5
          ).read();
          urllib.request.urlopen(
          "http://127.0.0.1:6998/openapi.json",
          timeout=10
          ).read()
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 6

  ui:
    <<: *common-service
    container_name: soorin-copilot-ui

    command:
      - python
      - -m
      - streamlit
      - run
      - app/app_st.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false

    environment:
      PYTHONPATH: /workspace/app

      SOORIN_API_BASE_URL: http://api:6998
      SOORIN_COPILOT_API_URL: http://api:6998
      SOORIN_COPILOT_API_KEY: "${SOORIN_COPILOT_API_KEY:?SOORIN_COPILOT_API_KEY is required}"
      SOORIN_API_TIMEOUT_SECONDS: "${SOORIN_API_TIMEOUT_SECONDS:-600}"

      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    ports:
      - "${SOORIN_UI_BIND_IP:-0.0.0.0}:${SOORIN_UI_HOST_PORT:-8503}:8501"

    volumes:
      - type: bind
        source: ./data
        target: /workspace/data
        read_only: true
        bind:
          create_host_path: false

    depends_on:
      api:
        condition: service_healthy

    stop_grace_period: 20s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from pathlib import Path;
          import urllib.request;
          Path("/workspace/app/app_st.py").open("rb").read(1);
          urllib.request.urlopen(
          "http://127.0.0.1:8501/_stcore/health",
          timeout=5
          ).read()
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

networks:
  copilot-network:
    driver: bridge
